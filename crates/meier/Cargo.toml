[package]
name = "meier"
default-run = "meier"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A cross-platform CLI for managing Firecracker microVMs locally or through Lima"
repository.workspace = true
readme = "README.md"
categories = ["command-line-utilities", "virtualization"]
keywords = ["firecracker", "microvm", "lima", "virtualization", "cli"]

[features]
default = []
daemon = ["dep:axum", "dep:barbirolli", "dep:elhone"]

[[bin]]
name = "meier"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, optional = true }
barbirolli = { workspace = true, optional = true }
clap.workspace = true
elhone = { workspace = true, optional = true }
futures.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
