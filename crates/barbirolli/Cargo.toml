[package]
name = "barbirolli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
linux = ["dep:dashmap", "dep:fctools", "dep:loopdev", "dep:nlink", "dep:rustix", "dep:serde_json", "dep:tempfile", "dep:tokio", "dep:tracing"]

[dependencies]
dashmap = { workspace = true, optional = true }
derive_more = { version = "2.1.1", features = ["full"] }
fctools = { workspace = true, features = [
    "direct-process-spawner",
    "tokio-runtime",
    "unrestricted-vmm-executor",
    "vm",
], optional = true }
nlink = { workspace = true, features = ["tuntap"], optional = true }
rustix = { version = "1.0.5", default-features = false, features = ["mount", "process"], optional = true }
serde.workspace = true
nonempty-collections.workspace = true
serde_json = { workspace = true, optional = true }
ssh-key.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
validated.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
loopdev = { package = "loopdev-3", version = "0.5.3", optional = true }

[dev-dependencies]
barbirolli_derive.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "behavior"
required-features = ["linux"]
