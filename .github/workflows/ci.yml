name: Linting, testing, and publishing

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets

  clippy:
    name: clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic

  package:
    name: package and install checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail
          packages=(barbirolli_derive barbirolli_entrypoint barbirolli elhone meier)
          for package in "${packages[@]}"; do
            # `cargo package` for dependent crates requires their prior
            # crates.io allocations; the release job performs that sequence.
            cargo package --locked --allow-dirty --no-verify --list --package "$package" >/tmp/"$package".list
            grep -q 'README.md' /tmp/"$package".list
          done
      - name: Build the default CLI
        run: cargo install --locked --path crates/meier --root target/meier-install --force
      - name: Build the feature-enabled daemon mode
        run: cargo build --locked --package meier --features daemon --bin meier

  publish:
    name: publish crates.io release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [fmt, test, clippy, package]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag and workspace version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "ssh"))')"
          test "$tag_version" = "$workspace_version"
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          packages=(barbirolli_derive barbirolli_entrypoint barbirolli elhone meier)
          for package in "${packages[@]}"; do
            if curl --fail --silent --show-error "https://crates.io/api/v1/crates/$package/$version" >/dev/null; then
              echo "$package $version is already published; skipping"
              continue
            fi
            cargo publish --locked --package "$package"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "https://crates.io/api/v1/crates/$package/$version" >/dev/null; then
                break
              fi
              if [ "$attempt" = 60 ]; then
                echo "timed out waiting for $package $version on crates.io" >&2
                exit 1
              fi
              sleep 10
            done
          done
