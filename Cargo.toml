[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "ssh"
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[workspace.dependencies]
axum = "0.8.8"
barbirolli = { version = "0.0.1", path = "crates/barbirolli", default-features = false }
barbirolli_derive = { version = "0.0.1", path = "crates/barbirolli_derive" }
barbirolli_entrypoint = { version = "0.0.1", path = "crates/barbirolli_entrypoint" }
clap = { version = "4.6.5", features = ["derive"] }
dashmap = "6.2.1"
derive_more = { version = "2.1.1", features = ["full"] }
elhone = { version = "0.0.1", path = "crates/elhone", default-features = false }
envy = "0.4.2"
meier = { version = "0.0.1", path = "crates/meier", default-features = false, features = ["daemon"] }
nonempty-collections = "1.4.0"
fctools = { version = "=0.6.0", default-features = false }
flate2 = "1.1.2"
futures = "0.3.32"
http-body-util = "0.1.3"
libc = "0.2.189"
nlink = "0.25.0"
nix = { version = "0.31.3", features = ["fs", "mount", "process", "reboot", "resource", "signal", "user"] }
oci-spec = "0.10.0"
pid1 = "0.1.6"
reqwest = { version = "0.13.4", default-features = false }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ssh-key = "0.7.0-rc.11"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validated = "1.0.0"
xattr = "1.6.1"
zstd = "0.13.3"

[dependencies]
envy.workspace = true
meier.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[workspace.package]
description = "A local Firecracker microVM deployment workspace"
categories = ["virtualization"]
keywords = ["firecracker", "microvm"]
license = "MIT"
repository = "https://github.com/aripiprazole/leverage_hiring"
authors = ["Gabrielle Oliveira <you@gabx.io>"]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
