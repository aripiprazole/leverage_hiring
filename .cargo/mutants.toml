no_default_features = true
test_workspace = true
features = ["linux"]
exclude_globs = [
  "crates/barbirolli/src/lifecycle/macos.rs",
  "crates/barbirolli/src/storage/macos.rs",
]

examine_re = [
  "is_authorized_key",
  "VmStore::",
  "NetworkSpec::",
  "Barbirolli::(vm|create|list|authorized_keys_path|delete|shutdown_all)",
  "BarbirolliVm::",
  "ManagedVm::",
]
